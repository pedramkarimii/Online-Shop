services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - ./volumes/redis/:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - main

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - ./volumes/db/:/var/lib/postgresql/data/
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - main

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_HOST_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    volumes:
      - ./volumes/rabbitmq/:/var/lib/rabbitmq/
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - main

  app:
    build:
     context: .
     dockerfile: utility/Dockerfile
     args:
          APP_UID: "${LOCAL_UID:-1000}"
          APP_GID: "${LOCAL_GID:-1000}"
    image: online-shop-app:local
    restart: unless-stopped
    env_file:
      - ./.env
    command:
      [
        "sh",
        "/app/utility/bin/entrypoint.sh",
        "gunicorn",
        "--bind",
        "0.0.0.0:${API_PORT:-8000}",
        "config.wsgi:application",
        "--log-level",
        "${API_LOG_LEVEL:-info}",
        "--workers",
        "${API_WORKERS:-2}",
        "--threads",
        "${API_THREADS:-2}",
        "--access-logfile",
        "-",
        "--error-logfile",
        "-"
      ]
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:${API_PORT:-8000}"
    volumes:
      - ./volumes/storage/:/app/volumes/storage/
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - main

  celery-worker:
    build:
        context: .
        dockerfile: utility/Dockerfile
        args:
          APP_UID: "${LOCAL_UID:-1000}"
          APP_GID: "${LOCAL_GID:-1000}"
    image: online-shop-app:local
    restart: unless-stopped
    env_file:
      - ./.env
    command: ["celery", "-A", "config", "worker", "-l", "INFO"]
    volumes:
      - ./volumes/storage/:/app/volumes/storage/
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - main

  nginx:
    build:
      context: ./utility/nginx/
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./logs/nginx/:/var/log/nginx/
      - ./volumes/storage/:/shared/
      - ./utility/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./volumes/nginx/proxy_dhparams/:/vol/proxy/
      - ./volumes/certbot/www/:/vol/www/
      - ./volumes/certbot/certs/:/etc/letsencrypt/
      - ./utility/nginx/default-ssl.conf.template:/etc/nginx/default-ssl.conf.template:ro
      - ./utility/nginx/default.conf.template:/etc/nginx/default.conf.template:ro
      - ./utility/nginx/entrypoint.sh:/entrypoint.sh:ro
    depends_on:
      app:
        condition: service_started
    networks:
      - main

  certbot:
    build:
      context: ./utility/certbot/
      dockerfile: Dockerfile
    command: echo "Certbot | Skipping ..."
    volumes:
      - ./volumes/certbot/www/:/vol/www/
      - ./volumes/certbot/certs/:/etc/letsencrypt/
    depends_on:
      nginx:
        condition: service_started
    networks:
      - main

networks:
  main:
